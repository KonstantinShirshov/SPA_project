name: Django CI

on: [ push, pull_request ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install --no-root

      - name: Create static directory
        run: mkdir -p static

      - name: Run migrate with SQLite
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: test-secret-key-for-ci
          USE_SQLITE: "true"
          DATABASE_URL: sqlite:///test_db.sqlite3
        run: |
          poetry run python manage.py migrate --noinput

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: test-secret-key-for-ci
          USE_SQLITE: "true"
          DATABASE_URL: sqlite:///test_db.sqlite3
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          CELERY_TASK_ALWAYS_EAGER: "true"
        run: poetry run python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Python and Poetry
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install poetry

      - name: Generate requirements.txt
        run: |
          poetry self add poetry-plugin-export
          poetry export --without-hashes --format=requirements.txt --output requirements.txt

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy files with rsync (FIXED)
        run: |
          echo "=== COPYING FILES WITH RSYNC ==="
          
            rsync -vv -avz \
            --progress \
            --recursive \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env*' \
            --exclude 'venv' \
            --exclude '.venv' \
            --exclude '*.log' \
            --exclude '*.sqlite3' \
            ./* "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_DIR }}/"

      - name: Install Python dependencies on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "cd ${{ secrets.DEPLOY_DIR }} && python3.13 -m venv venv"
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "cd ${{ secrets.DEPLOY_DIR }} && source venv/bin/activate && pip install --upgrade pip"
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "cd ${{ secrets.DEPLOY_DIR }} && source venv/bin/activate && pip install -r requirements.txt"

      - name: Apply migrations on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd ${{ secrets.DEPLOY_DIR }}
            source venv/bin/activate
      
            # Установите переменные окружения согласно settings.py
            export SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}"
            export USE_SQLITE="False"  # Явно указываем использовать PostgreSQL
            export POSTGRES_DB="${{ secrets.POSTGRES_DB }}"  # Имя базы: spa_project
            export POSTGRES_USER="${{ secrets.POSTGRES_USER }}"  # Пользователь: spa_user
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"  # Пароль: spa_password
            export POSTGRES_HOST="localhost"
            export POSTGRES_PORT="5432"
                        
            
            mkdir -p static
                            
            
            echo "=== Applying migrations ==="
            python manage.py migrate --noinput
          EOF

      - name: Collect static files on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd ${{ secrets.DEPLOY_DIR }}
            source venv/bin/activate
      
            # Те же переменные окружения
            export SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}"
            export USE_SQLITE="False"
            export POSTGRES_DB="${{ secrets.POSTGRES_DB }}"
            export POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            export POSTGRES_HOST="localhost"
            export POSTGRES_PORT="5432"
      
            python manage.py collectstatic --noinput
          EOF

      - name: Restart application
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            sudo systemctl restart myapp.service
          EOF
