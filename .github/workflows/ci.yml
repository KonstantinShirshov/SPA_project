name: Django CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install --no-root

      - name: Create static directory
        run: mkdir -p static

      - name: Run migrate with SQLite
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: test-secret-key-for-ci
          USE_SQLITE: "true"
          DATABASE_URL: sqlite:///test_db.sqlite3
        run: |
            poetry run python manage.py migrate --noinput

      - name: Run tests
        env:
            DJANGO_SETTINGS_MODULE: config.settings
            SECRET_KEY: test-secret-key-for-ci
            USE_SQLITE: "true"
            DATABASE_URL: sqlite:///test_db.sqlite3
            CELERY_BROKER_URL: redis://localhost:6379/0
            CELERY_RESULT_BACKEND: redis://localhost:6379/0
            CELERY_TASK_ALWAYS_EAGER: "true"
        run: poetry run python manage.py test

  deploy:
      runs-on: ubuntu-latest
      needs: test

      steps:
        - name: Check out code
          uses: actions/checkout@v3

        - name: Set up Python for requirements generation
          uses: actions/setup-python@v4
          with:
            python-version: '3.13'

        - name: Install Poetry
          run: |
            pip install poetry

        - name: Generate requirements.txt
          run: |
            poetry export --without-hashes --format=requirements.txt --output requirements.txt
            echo "Generated requirements.txt:"
            head -10 requirements.txt

        - name: Set up SSH
          uses: webfactory/ssh-agent@v0.9.1
          with:
            ssh-private-key: ${{ secrets.SSH_KEY }}

        - name: Add host key
          run: |
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts

        - name: Check local files
          run: |
            echo "=== LOCAL FILES ==="
            pwd
            ls -la
            echo ""
            echo "Looking for pyproject.toml:"
            find . -name "pyproject.toml" -type f
            echo ""
            echo "Total files to copy:"
            find . -type f | wc -l

        - name: Copy files with rsync (FIXED)
          run: |
            echo "=== COPYING FILES WITH RSYNC ==="
            
            # Вариант A: Копируем все файлы и папки
            rsync -vv -avz \
              --progress \
              --recursive \
              --exclude '.git' \
              --exclude '.github' \
              --exclude '__pycache__' \
              --exclude '*.pyc' \
              --exclude '.env*' \
              --exclude 'venv' \
              --exclude '.venv' \
              --exclude '*.log' \
              --exclude '*.sqlite3' \
              ./* "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_DIR }}/"
        
        - name: Install Python and system dependencies on server
          run: |
            ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "cd ${{ secrets.DEPLOY_DIR }} && sudo apt-get update -q"
            ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "cd ${{ secrets.DEPLOY_DIR }} && DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -q python3.13 python3.13-venv python3.13-dev libpq-dev postgresql-client build-essential"

        - name: Install Python dependencies on server
          run: |
            ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "cd ${{ secrets.DEPLOY_DIR }} && python3.13 -m venv venv"
            ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "cd ${{ secrets.DEPLOY_DIR }} && source venv/bin/activate && pip install --upgrade pip"
            ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "cd ${{ secrets.DEPLOY_DIR }} && source venv/bin/activate && pip install -r requirements.txt"

        - name: Apply migrations on server
          run: |
            ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
              cd ${{ secrets.DEPLOY_DIR }}
              source venv/bin/activate
              python manage.py migrate --noinput
            EOF

        - name: Collect static files on server
          run: |
            ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
              cd ${{ secrets.DEPLOY_DIR }}
              source venv/bin/activate
              python manage.py collectstatic --noinput
            EOF

        - name: Restart application
          run: |
            ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
              sudo systemctl restart myapp.service
            EOF
